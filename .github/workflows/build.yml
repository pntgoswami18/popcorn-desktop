name: Latest Build

on:
  # '*' does not match a branch name containing '/', so pushes to ci/…, fix/…
  # and release/… never triggered this workflow. In the last 60 runs the only
  # head refs that ever built were `development` and the v* tags, which means
  # every pull request so far merged without CI having run on it once.
  #
  # `development` is listed explicitly rather than switching to '**' so that a
  # same-repo pull request does not build twice, once for its branch push and
  # again for the pull_request event -- this matrix is nine jobs. Building an
  # arbitrary ref on demand is already covered by release-builds.yml's
  # workflow_dispatch.
  push:
    branches:
      - development
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}

    strategy:
      # One combination failing must not cancel the rest of the matrix -- the
      # legacy nwjs 0.44.5 linux deb-rename path is narrow and unrelated to
      # the other seven combinations; without this, its failure took down
      # the osx-arm64/osx64/win64 builds before they could even run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
        nwjs: ['0.44.5', '0.86.0']
        include:
          # Apple Silicon build. Kept as its own combination rather than a 4th
          # `os` entry: nwjs 0.44.5 has no osx-arm64 build (404 from the NW.js
          # CDN), so it can only pair with 0.86.0. `platform` is set directly
          # here rather than through variable-mapper below, which only knows
          # the three `os` values in its map and silently no-ops (leaves
          # env.platform unset) for anything else.
          - os: macos-14
            nwjs: '0.86.0'
            platform: osx-arm64

    steps:
      - name: Context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reconfigure git to use HTTP authentication
        run: >
          git config --global url."https://github.com/".insteadOf
          ssh://git@github.com/

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: yarn version
        run: |
          yarn version

      - name: node version
        run: |
          node --version

      - name: Map runner to platform
        # Was kiriles90/variable-mapper@master, which now fails every run with
        # "repository not found" -- the action was deleted or its owner's
        # account removed. Replaced with a plain inline mapping so this step
        # can't disappear out from under the workflow again.
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest)  echo "platform=linux64" >> "$GITHUB_ENV" ;;
            macOS-latest)   echo "platform=osx64" >> "$GITHUB_ENV" ;;
            windows-latest) echo "platform=win64" >> "$GITHUB_ENV" ;;
          esac

      - name: Build info
        run: echo Build ${{ matrix.platform || env.platform }} on nw-v${{ matrix.nwjs }}

      - name: Build App
        run: |
          yarn
          yarn gulp dist --platforms=${{ matrix.platform || env.platform }} --nwVersion=${{ matrix.nwjs }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform || env.platform }}-${{ matrix.nwjs }}
          path: build

  packs:
    needs: build
    name: Packs
    runs-on: ubuntu-latest

    strategy:
      matrix:
        nwjs: ['0.44.5', '0.86.0']

    steps:
      - name: Context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - uses: actions/checkout@v7
        with:
          path: repo
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: linux64-${{ matrix.nwjs }}
          path: .

      - name: Install packages and appimagetool
        run: |
          sudo apt update
          sudo apt install -y libfuse2
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        run: |
          VER=$(ls *-linux64*.zip | sed 's/-linux64.*//')
          echo $VER
          unzip -q *-linux64*.zip -d $VER.AppDir
          cp repo/dist/linux/appimage/* $VER.AppDir/
          ln -s Popcorn-Time $VER.AppDir/AppRun
          mkdir build
          ARCH=x86_64 ./appimagetool-x86_64.AppImage $VER.AppDir build/$VER-linux64${{ matrix.nwjs == '0.44.5' && '-0.44.5' || '' }}.AppImage

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux64-${{ matrix.nwjs }}.AppImage
          path: build


  release:
    needs: packs
    name: Release
    runs-on: ubuntu-latest
    # Only tags produce a release. This was previously enforced per-step, so
    # the job still spun up and downloaded every artifact -- well over a
    # gigabyte -- on runs that could never publish anything. With pull
    # requests now building, that would happen on every PR.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      # Repo default workflow permission is read-only (settings, not code),
      # so ncipollo/release-action failed with 403 "Resource not accessible
      # by integration" trying to create the release. Scoped here rather
      # than raising the repo-wide default, since this is the only job that
      # needs write access.
      contents: write
    steps:
      - name: Context
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - uses: ncipollo/release-action@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          allowUpdates: true
          name: ${{ github.ref_name }}
          artifacts: "artifacts/*"
          # Without a body this published bare releases -- eleven similarly
          # named assets and nothing saying which one to download, or what
          # changed. `body` carries the part that is the same every release;
          # generateReleaseNotes asks GitHub for the commit/PR summary, which
          # it appends underneath. Anything release-specific worth calling out
          # goes in by hand afterwards, on top of both -- and omitBodyDuringUpdate
          # keeps those hand-written notes when allowUpdates re-runs a release
          # for an existing tag, which would otherwise reset the body to this
          # template.
          generateReleaseNotes: true
          omitBodyDuringUpdate: true
          body: |
            ## Which download?

            | Platform | Asset |
            | --- | --- |
            | macOS, Apple Silicon | `*-osx-arm64.zip` |
            | macOS, Intel | `*-osx64.zip` |
            | Windows x64 | `*-win64.zip` |
            | Linux, portable | `*-linux64.AppImage` |
            | Linux, Debian/Ubuntu | `*-amd64.deb` |
            | Linux, archive | `*-linux64.zip` |

            Assets suffixed `-0.44.5` are built against the legacy NW.js 0.44.5
            runtime for machines that cannot run the current one. Everything
            else uses NW.js 0.86.0.

            macOS builds are ad-hoc signed, not notarized. On first launch,
            right-click the app and choose **Open**, or clear the quarantine
            flag:

            ```
            xattr -cr /Applications/Popcorn-Time.app
            ```

            Turning on **Native window frame** or **Audio passthrough** rewrites
            the manifest inside the app bundle, because NW.js reads those two
            settings only from there and only at startup. That invalidates the
            ad-hoc signature, so the app re-signs itself afterwards. If that
            re-sign is ever unavailable the app still runs -- macOS only checks
            the signature while the download quarantine flag is set -- but a
            copy passed on to another Mac may be refused as damaged. Re-signing
            by hand restores it:

            ```
            codesign --force --sign - /Applications/Popcorn-Time.app
            ```
